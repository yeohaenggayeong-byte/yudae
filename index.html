<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별나무의 방 (사진 포함)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: full-bleed 3D view; overlay = top buttons + hint, joystick bottom-left, action pill bottom-right (matches reference screen) */
:root{
  --night:#0f0d0a; --cream:#d9cdb8; --hint:#cbbd9f; --amber:#f6c98a; --ink:#2a1d0c; --chip:#f7f5f1;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 48%,transparent 55%,rgba(0,0,0,.55) 100%)}
.ui{position:relative;height:100%;display:flex;flex-direction:column;pointer-events:none}
.ui > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;padding-top:12px;position:relative}
.round{width:56px;height:56px;border-radius:50%;border:0;background:var(--chip);color:#2a2622;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.round:focus-visible,.enter:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.hint{pointer-events:none!important;text-align:center;color:var(--hint);font-size:17px;line-height:1.5;margin:22px auto 0;max-width:30em;text-wrap:balance;transition:opacity .3s;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.spacer{flex:1;pointer-events:none!important}
.photoBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(330px + env(safe-area-inset-bottom,0px));z-index:6;height:48px;padding:0 22px;border:0;border-radius:24px;background:var(--chip);color:#2a2622;font:600 16px var(--body);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.photoBtn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.album{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,6,4,.78);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-user-select:none;user-select:none}
.album[hidden]{display:none!important}
.alb-top{width:min(100%,560px);display:flex;justify-content:space-between;align-items:center;color:var(--hint);font-size:15px}
.alb-close{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:#2a2622;font-size:20px;cursor:pointer}
.alb-book{width:min(100%,560px);aspect-ratio:1.45;max-height:62vh;display:flex;perspective:1400px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.alb-page{flex:1;min-width:0;min-height:0;grid-template-columns:minmax(0,1fr)!important;background:#f3ecdf;background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.035) 0 2px,transparent 2px 6px);padding:6% 5%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:6%;position:relative;transform-origin:left center;transition:transform .55s cubic-bezier(.5,.1,.25,1)}
.alb-page.l{border-radius:10px 2px 2px 10px;box-shadow:inset -14px 0 18px -10px rgba(80,55,30,.35);transform-origin:right center}
.alb-page.r{border-radius:2px 10px 10px 2px;box-shadow:inset 14px 0 18px -10px rgba(80,55,30,.35)}
.alb-page.flipR{transform:rotateY(-160deg)}.alb-page.flipL{transform:rotateY(160deg)}
.slot{position:relative;min-height:0;height:100%;overflow:hidden;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;padding:4%;box-shadow:0 3px 8px rgba(60,40,20,.3);transform:rotate(var(--r,0deg))}
.slot .empty{width:86%;height:100%;border:2px dashed rgba(120,90,60,.45);border-radius:8px;display:grid;place-items:center;color:#8a6a48;font:600 14px var(--body);text-align:center;line-height:1.4}
.slot:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.alb-nav{display:flex;gap:12px;align-items:center;color:var(--hint);font-size:14px;font-variant-numeric:tabular-nums}
.alb-nav button{height:44px;min-width:88px;padding:0 16px;border-radius:22px;border:0;background:var(--chip);color:#2a2622;font:600 15px var(--body);cursor:pointer}
.alb-nav button:disabled{opacity:.35;cursor:default}
.alb-view{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.88);padding:16px}
.alb-view[hidden]{display:none!important}
.alb-view img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:4px}
.alb-view .row{display:flex;gap:10px}
.alb-view button{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--chip);color:#2a2622;font:600 15px var(--body);cursor:pointer}
@media (max-width:600px){.alb-book{aspect-ratio:.95}}
@media (prefers-reduced-motion:reduce){.alb-page{transition:none}}
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(8,6,4,.8);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet[hidden]{display:none!important}
.receipt{width:min(100%,300px);max-height:70vh;overflow:auto;background:#fbfaf6;color:#2a2622;padding:22px 20px 26px;font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;box-shadow:0 18px 40px rgba(0,0,0,.5);transform:rotate(-1.2deg);
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 10px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 10px repeat-x}
.receipt h3{margin:0 0 2px;text-align:center;font:700 17px var(--body);letter-spacing:.04em}
.receipt .sub{text-align:center;color:#6b635a;font-size:12px;margin-bottom:10px}
.receipt .row{display:flex;justify-content:space-between;gap:12px}
.receipt .row span:first-child{min-width:0}
.receipt hr{border:0;border-top:1px dashed #b9b0a3;margin:9px 0}
.receipt .tot{font-weight:700;font-size:15px}
.receipt .memo{margin-top:10px;padding:8px 10px;background:#f1ece2;border-radius:4px;font-family:var(--body);font-size:13px}
.sheet button{height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--chip);color:#2a2622;font:600 16px var(--body);cursor:pointer}
.sheet button.primary{background:var(--amber);color:var(--ink)}
.sheet button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.endcard{width:min(100%,340px);background:#1c1813;border:1px solid #3a332a;border-radius:20px;padding:28px 22px 22px;text-align:center;color:var(--cream);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.endcard h2{margin:0 0 8px;font:700 26px "Gowun Batang",serif;color:var(--amber);text-wrap:balance}
.endcard p{margin:0 0 20px;color:var(--hint);line-height:1.6}
.endcard .btns{display:flex;flex-direction:column;gap:10px}
.count{pointer-events:none!important;align-self:center;margin-top:14px;padding:5px 14px;border-radius:999px;background:rgba(15,13,10,.6);border:1px solid rgba(203,189,159,.25);color:var(--hint);font-size:14px;font-variant-numeric:tabular-nums;order:1}
.hint{background:rgba(14,12,9,.86);color:#e8dcc4!important;padding:12px 18px;border-radius:14px;max-width:min(30em,calc(100vw - 32px))!important;font-size:16px!important;text-shadow:none!important;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.hint:empty{display:none}
.top{order:0}.spacer{order:3}.hint{order:4;margin:0 auto 6px!important}.controls{order:5}
.count{display:none!important}
.missions{width:auto!important;max-width:min(240px,62vw);position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(80px + env(safe-area-inset-top,0px));z-index:6;pointer-events:none;width:min(210px,56vw);padding:12px 14px 10px;border-radius:14px;background:rgba(15,13,10,.62);border:1px solid rgba(203,189,159,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:var(--cream);font-size:13px;line-height:1.35}
.missions[hidden]{display:none!important}
.missions h4{margin:0 0 6px;font:700 12px var(--body);letter-spacing:.12em;color:var(--amber)}
.missions ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.missions li{display:flex;gap:6px;align-items:baseline;color:rgba(217,205,184,.55);transition:color .3s}
.missions li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;transform:translateY(1px)}
.missions li.now{color:var(--cream);font-weight:600}
.missions li.now::before{background:var(--amber);border-color:var(--amber)}
.missions li.done{text-decoration:line-through;color:rgba(217,205,184,.32)}
.missions li.done::before{background:currentColor}
.missions .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:400}
@media (prefers-reduced-motion:reduce){.missions li{transition:none}}
.controls{position:relative;height:210px;pointer-events:none!important}
.stick{pointer-events:auto;position:absolute;left:8px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;
  background:rgba(24,20,15,.72);border:1.5px solid #3a332a;touch-action:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--cream);transition:transform .15s;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.stick.drag .knob{transition:none}
.enter{pointer-events:auto;position:absolute;right:4px;bottom:calc(52px + env(safe-area-inset-bottom,0px));min-width:132px;height:64px;padding:0 26px;border:0;border-radius:32px;
  background:var(--amber);color:var(--ink);font:600 22px var(--body);cursor:pointer;transition:transform .12s,opacity .3s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.enter:active{transform:scale(.96)}
.menu{position:absolute;right:0;top:76px;background:var(--chip);color:#2a2622;border-radius:14px;padding:6px;z-index:9;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;border:0;background:none;font:16px var(--body);padding:12px 18px;text-align:left;border-radius:9px;cursor:pointer;color:inherit;white-space:nowrap}
.menu button:hover{background:#ebe6dd}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);color:var(--hint);font-size:16px;z-index:30;transition:opacity .8s}
.loading.done{opacity:0;pointer-events:none}
.err{max-width:22em;text-align:center;line-height:1.6}
@media (prefers-reduced-motion:reduce){.loading,.hint{transition:none}}
</style>
</head>
<body>


<canvas id="view"></canvas>
<div class="vignette"></div>
<div class="ui">
  <div class="top">
    <button class="round" id="reset" aria-label="처음 위치로">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <button class="round" id="more" aria-label="메뉴">
      <svg width="26" height="6" viewBox="0 0 26 6" fill="currentColor"><circle cx="4" cy="3" r="2.2"/><circle cx="13" cy="3" r="2.2"/><circle cx="22" cy="3" r="2.2"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <button id="mDoor">문 열기 / 닫기</button>
      <button id="mSound">소리 끄기</button>
      <button id="mRestart">처음부터 다시</button>
      <button id="mClose">닫기</button>
    </div>
  </div>
  <div class="missions" id="missions" hidden aria-live="polite"><h4 id="mHead">MISSION</h4><ol id="mList"></ol></div>
  <div class="count" id="count" hidden>빨래 0/4</div>
  <p class="hint" id="hint">문 앞이에요. ‘들어가기’를 누르거나 앞으로 걸어가 보세요.</p>
  <div class="spacer"></div>
  <div class="controls">
    <div class="stick" id="stick" aria-label="걷기 조이스틱"><div class="knob" id="knob"></div></div>
    <button class="enter" id="enter">들어가기</button>
  </div>
</div>
<div class="sheet" id="rcSheet" hidden role="dialog" aria-label="영수증"><div class="receipt" id="rcBody"></div><button id="rcClose">닫기</button></div>
<div class="sheet" id="endSheet" hidden role="dialog" aria-label="청소 완료"><div class="endcard"><h2>청소 완료!</h2><p>⭐️🌳의 방이 깨끗해졌어요.<br>이제 어떻게 할까요?</p><div class="btns"><button class="primary" id="endFree">자유롭게 둘러보기</button><button id="endAgain">처음부터 다시 하기</button></div></div></div>
<div class="album" id="album" hidden role="dialog" aria-label="앨범">
  <div class="alb-top"><span id="albTitle">앨범</span><button class="alb-close" id="albClose" aria-label="앨범 닫기">✕</button></div>
  <div class="alb-book"><div class="alb-page l" id="pgL"></div><div class="alb-page r" id="pgR"></div></div>
  <div class="alb-nav"><button id="albPrev">‹ 이전</button><span id="albNum">1 / 6</span><button id="albNext">다음 ›</button></div>
</div>
<div class="alb-view" id="albView" hidden><img id="albBig" alt="앨범 사진"><div class="row"><button id="albSwap">사진 바꾸기</button><button id="albDel">빼기</button><button id="albBack">닫기</button></div></div>
<input type="file" id="albIn" accept="image/*" multiple hidden>
<button class="photoBtn" id="photoBtn" hidden>사진 넣기</button><input type="file" id="photoIn" accept="image/*" multiple hidden>
<div class="loading" id="loading"><div class="err" id="loadMsg">방을 준비하고 있어요…</div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

const $=id=>document.getElementById(id);
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const V3=THREE.Vector3;

/* ---------- renderer ---------- */
const canvas=$('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050403);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.05,40);
// wide view (like a 0.5x lens): keep ~62° across even on a tall phone screen
function fitFov(){const a=innerWidth/innerHeight;camera.aspect=a;camera.fov=Math.max(66,Math.min(104,2*Math.atan(Math.tan(31*Math.PI/180)/a)*180/Math.PI));camera.updateProjectionMatrix()}
fitFov();
camera.rotation.order='YXZ';

/* ---------- procedural textures ---------- */
const ANISO=renderer.capabilities.getMaxAnisotropy();
function tex(w,h,draw,rx=1,ry=1,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d',{willReadFrequently:true}),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=ANISO;
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;
}
function speckle(g,w,h,lo,hi){const d=g.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const v=lo+rnd()*(hi-lo);d.data[i]*=v;d.data[i+1]*=v;d.data[i+2]*=v}g.putImageData(d,0,0)}
const plasterT=(rx,ry)=>tex(512,512,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){g.fillStyle=`rgba(0,0,0,${rnd()*.012})`;g.beginPath();g.arc(rnd()*w,rnd()*h,4+rnd()*20,0,7);g.fill()}speckle(g,w,h,.95,1)},rx,ry);
const fabricT=(rx,ry,lines=true)=>tex(512,512,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);
  if(lines)for(let y=0;y<h;y+=3){g.fillStyle=`rgba(0,0,0,${.03+rnd()*.03})`;g.fillRect(0,y,w,1)}
  if(lines)for(let x=0;x<w;x+=3){g.fillStyle=`rgba(0,0,0,${.02+rnd()*.03})`;g.fillRect(x,0,1,h)}
  speckle(g,w,h,.86,1)},rx,ry);
const stripeT=(c1,c2,rx)=>tex(256,256,(g,w,h)=>{g.fillStyle=c2;g.fillRect(0,0,w,h);g.fillStyle=c1;for(let x=0;x<w;x+=32)g.fillRect(x,0,14,h);speckle(g,w,h,.9,1)},rx,1);
const bumpT=(rx,ry)=>tex(256,256,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);speckle(g,w,h,.7,1.3)},rx,ry,false);
function woodT(planks,h0,s0,l0,lv,rx,ry,seams=true){return tex(1024,1024,(g,w,h)=>{const pw=w/planks;
  for(let i=0;i<planks;i++){const l=l0+(rnd()-.5)*lv;g.fillStyle=`hsl(${h0+(rnd()-.5)*4},${s0}%,${l}%)`;g.fillRect(i*pw,0,pw,h);
    for(let k=0;k<90;k++){const ll=l+(rnd()-.5)*16;g.strokeStyle=`hsla(${h0},${s0}%,${ll}%,${.12+rnd()*.25})`;g.lineWidth=.4+rnd()*1.8;g.beginPath();
      let x=i*pw+rnd()*pw;const a=rnd()*4,f=.004+rnd()*.01,p=rnd()*9;g.moveTo(x,0);for(let y=0;y<=h;y+=24)g.lineTo(x+Math.sin(y*f+p)*a,y);g.stroke()}
    if(seams){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(i*pw,0,2,h);const j=rnd()*h;g.fillRect(i*pw,j,pw,2);g.fillRect(i*pw,(j+h*.5)%h,pw,2)}}
  speckle(g,w,h,.92,1)},rx,ry)}

/* ---------- materials ---------- */
const M=(o)=>new THREE.MeshStandardMaterial(o);
const mat={
  wall:M({color:0xcbc3b6,map:plasterT(3,2),roughness:.95}),
  hallWall:M({color:0x8a7f72,map:plasterT(2,2),roughness:.95}),
  ceil:M({color:0xd2cabd,map:plasterT(3,3),roughness:1}),
  floor:M({map:woodT(8,28,40,42,8,2,2),roughness:.5,bumpMap:bumpT(8,8),bumpScale:.4}),
  walnut:M({map:woodT(1,24,40,26,4,1,1,false),roughness:.55}),
  wardrobe:M({map:woodT(1,26,40,40,3,1,1,false),roughness:.5}),
  carcass:M({color:0x1c140e,roughness:.8}),
  door:M({map:woodT(1,28,42,30,4,1,1,false),roughness:.5}),
  trim:M({color:0xe8e0d2,roughness:.6}),
  panel:M({color:0xd6cfc4,roughness:.7}),

function mesh(geo,m,x=0,y=0,z=0,cast=true,recv=true,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=recv;parent.add(o);return o}

const wrinkle=(x,zz,k)=>0.018*Math.sin(x*7+zz*3+k)+0.008*Math.sin(x*13-zz*9+1.3+k)+0.04*Math.sin(x*2.1+1+k)*Math.sin(zz*3.3+k)+0.02*Math.cos(x*4.7-zz*1.9);
function cloth({w,l,top,hw,hl,amp=1,seedK=0,m}){
  const g=new THREE.PlaneGeometry(w,l,80,80);g.rotateX(-Math.PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),z=p.getZ(i);const zz=z+l/2;
    let y=top+amp*wrinkle(x,zz,seedK);
    const dx=Math.max(0,Math.abs(x)-hw),dz=Math.max(0,zz-hl);
    if(dx>0){x=Math.sign(x)*(hw+.015+dx*.14+Math.sin(zz*24)*.012*dx*4);y-=dx*.97}
    if(dz>0){z=(hl+.015+dz*.14+Math.sin(x*22)*.012*dz*4)-l/2;y-=dz*.97}
    p.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function pillow(w,h,d,m,x,y,z,rx=0,ry=0,rz=0){
  const g=new RoundedBoxGeometry(w,h,d,6,Math.min(h,d)*.45),p=g.attributes.position;
  for(let i=0;i<p.count;i++){const px=p.getX(i)/(w/2),pz=p.getZ(i)/(d/2);p.setY(i,p.getY(i)*(1-.55*px*px)*(1-.45*pz*pz))}

}
function crumple(r,m,x,y,z,sy=.35,k=0,parent=scene,soft=1){
  const g=new THREE.IcosahedronGeometry(r,5),p=g.attributes.position,v=new V3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize();

    v.copy(n).multiplyScalar(r*d);v.y*=sy;p.setXYZ(i,v.x,v.y,v.z)}

}

  page:t=>{nz(t,.22,{f0:1800,f1:900,q:.8,gain:.12,att:.05});nz(t+.18,.06,{type:'highpass',f0:3000,gain:.06})},

function wrap(fn,before,after){return function(...a){const st=before?before():null;const r=fn.apply(this,a);after&&after(st,a);return r}}

/* ---------- short-sleeve pajama shirt tucked under the left duvet (mint, green piping, stars & notes) ---------- */

{const pjT=tex(512,512,(g,w,h)=>{g.fillStyle='#dff1e6';g.fillRect(0,0,w,h);
    const star=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr=i%2?r*.5:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()};
    const note=(x,y,c)=>{g.fillStyle=g.strokeStyle=c;g.lineWidth=4;g.beginPath();g.ellipse(x,y,9,7,-.4,0,7);g.fill();g.beginPath();g.moveTo(x+8,y);g.lineTo(x+8,y-26);g.quadraticCurveTo(x+18,y-20,x+20,y-10);g.stroke()};
    const paw=(x,y)=>{g.fillStyle='#d9b88a';[-1,1].forEach(d=>{g.beginPath();g.ellipse(x+d*19,y+4,8,14,d*.35,0,7);g.fill()});
      g.fillStyle='#ecd5b0';g.beginPath();g.ellipse(x,y,20,17,0,0,7);g.fill();g.strokeStyle='#8a6a48';g.lineWidth=1.5;g.stroke();
